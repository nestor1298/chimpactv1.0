# chimpact.org on Cloudflare Workers (static assets + one API route)
name = "chimpact"
main = "worker/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Waitlist storage (KV namespace WAITLIST).
[[kv_namespaces]]
binding = "WAITLIST"
id = "ac5dd8c828c641a39573c5d89c4b9ab0"

# Served on chimpact.org and www.chimpact.org (zone in this Cloudflare account).
routes = [
  { pattern = "chimpact.org", custom_domain = true },
  { pattern = "www.chimpact.org", custom_domain = true }
]
