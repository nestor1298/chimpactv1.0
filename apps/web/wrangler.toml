# chimpact.org on Cloudflare Workers (static assets + one API route)
name = "chimpact"
main = "worker/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Waitlist storage. Create it once with:  npx wrangler kv namespace create WAITLIST
# then paste the id it prints here and uncomment.
# [[kv_namespaces]]
# binding = "WAITLIST"
# id = "<id from the command above>"

# Served on chimpact.org and www.chimpact.org (zone in this Cloudflare account).
routes = [
  { pattern = "chimpact.org", custom_domain = true },
  { pattern = "www.chimpact.org", custom_domain = true }
]
